name: Publish PrettySmooth Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Publish Geode package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create GitHub Release and attach Geode package
        uses: softprops/action-gh-release@v2
        with:
          name: PrettySmooth ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*.geode
